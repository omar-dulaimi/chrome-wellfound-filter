<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wellfound Filter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 340px;
      margin: 0;
      padding: 14px;
      color: #111;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .title { font-size: 15px; font-weight: 600; }

    /* Toggle switch */
    .toggle { position: relative; display: inline-block; width: 38px; height: 22px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #ccc; border-radius: 22px; transition: .2s;
    }
    .slider::before {
      content: ''; position: absolute;
      width: 16px; height: 16px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #2563eb; }
    input:checked + .slider::before { transform: translateX(16px); }

    /* Logic row */
    .logic-row {
      font-size: 13px; color: #444;
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 10px;
    }
    select {
      font-size: 12px; padding: 3px 6px;
      border: 1px solid #d1d5db; border-radius: 5px;
      background: #fff; cursor: pointer;
    }

    /* Rules */
    #rules { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .rule {
      display: flex; align-items: center; gap: 5px;
      background: #f9fafb; border: 1px solid #e5e7eb;
      border-radius: 6px; padding: 6px 8px;
    }
    .rule input[type="text"] {
      flex: 1; font-size: 13px; padding: 3px 6px;
      border: 1px solid #d1d5db; border-radius: 4px;
      min-width: 0;
    }
    .not-badge {
      font-size: 11px; font-weight: 600; color: #6b7280;
      display: flex; align-items: center; gap: 3px;
      white-space: nowrap; cursor: pointer;
      user-select: none;
    }
    .not-badge input { cursor: pointer; margin: 0; }
    .delete-btn {
      background: none; border: none; cursor: pointer;
      color: #9ca3af; font-size: 18px; line-height: 1;
      padding: 0 2px; flex-shrink: 0;
    }
    .delete-btn:hover { color: #ef4444; }

    /* Add button */
    #add-btn {
      font-size: 13px; color: #2563eb;
      background: none; border: none; cursor: pointer;
      padding: 0;
    }
    #add-btn:hover { text-decoration: underline; }

    /* Status */
    #status { font-size: 11px; color: #6b7280; margin-top: 8px; min-height: 14px; }

    /* Disabled state dims controls */
    body.disabled .logic-row,
    body.disabled #rules,
    body.disabled #add-btn { opacity: 0.4; pointer-events: none; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Wellfound Filter</span>
    <label class="toggle" title="Enable / disable filtering">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="logic-row">
    Hide if
    <select id="logic">
      <option value="OR">ANY</option>
      <option value="AND">ALL</option>
    </select>
    rule matches:
  </div>

  <div id="rules"></div>
  <button id="add-btn">＋ Add rule</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
